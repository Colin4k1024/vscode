name: Codex Desktop Baseline

# D01 (#3): minimal reproducible bootstrap + transpile + codex protocol sync +
# agent-host unit test subset on a stock GitHub-hosted runner. Runs on PRs and
# on demand; later issues (D11/D14) fold these checks into PR-required gates.
# D11 (#13): the `agent-host-e2e` job below gates every PR on the deterministic
# replay suite (no token, no network; an unrecorded model request is a hard
# failure).
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCODE_QUALITY: 'oss'

jobs:
  linux:
    name: Bootstrap, transpile, protocol sync, agent-host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Fast feedback before any heavy step: the bootstrap script is not
      # otherwise exercised on CI (CI installs via npm ci directly), so at
      # least statically gate it (round-2 review caught a set -euo pipefail
      # glob regression that local runs and CI were both blind to).
      - name: Shellcheck bootstrap script
        run: |
          command -v shellcheck >/dev/null || sudo apt install -y shellcheck
          shellcheck .agents/research/codex-desktop/bootstrap.sh

      # D06 product mixin guards — all three run on the pristine tree (before
      # any apply-mixin), need only checkout + node, and are cheap. Keep them
      # ahead of the heavy install/transpile steps for fast feedback.
      # (check-branding-residue.sh is deliberately not here: it scans a
      # packaged app directory, which this job does not produce.)
      - name: D06 product mixin guards (pristine tree)
        run: |
          bash scripts/check-product-json-pristine.sh
          bash scripts/check-branding-identity.sh
          bash scripts/check-r12-guard.sh

      # D08 (#10) telemetry/egress isolation gate — static half of AC1.
      # Needs only checkout + node: merges the product mixin in memory and
      # scans non-test sources for denylisted MS/GitHub egress endpoints.
      - name: D08 network egress audit (static)
        run: bash scripts/audit-network-egress.sh

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-codex-desktop
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      # D12 / Issue #53: no src typecheck ever ran on this fork — pr.yml's
      # typecheck jobs schedule on Microsoft's 1ES pool, which never picks up
      # runs here — so type errors in agentHost test files accumulated
      # silently. Gate the full client tsconfig on every PR through this
      # baseline job (tsc resolves to @typescript/native, i.e. tsgo).
      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check client (src/tsconfig.json)
        run: npm run typecheck-client

      # D14 (Issue #16): fold the remaining always-green guards into the
      # effective PR gate set. pr.yml runs these on Microsoft's self-hosted
      # 1ES pool, which never schedules on this fork — baseline is the only
      # PR gate that actually runs here (see UPSTREAM-SYNC.md section 6).
      # eslint is deliberately NOT here yet: 43 pre-existing warnings on main
      # (D07/D12/D13 test files) would make every PR red; tracked as a
      # follow-up in UPSTREAM-SYNC.md section 6.
      - name: Build script tests (versionSync, protocol-sync helpers)
        run: npm run test-build-scripts

      - name: Hygiene
        run: npm run hygiene

      - name: Stylelint
        run: npm run stylelint

      - name: Transpile client and extensions
        run: npm run gulp transpile-client-esbuild transpile-extensions

      - name: Check clean git state
        run: bash .github/workflows/check-clean-git-state.sh

      # D14 (Issue #16): --if-changed mode — PRs that touch neither
      # protocol/generated/** nor build/codex/codex-version.txt skip the
      # regeneration check (exit 0); PRs that touch them must pass it.
      # The same gate runs in pr.yml ("Check Codex protocol client is in sync").
      - name: Codex protocol sync (if changed)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            # workflow_dispatch: no diff base — run the full freshness check.
            npm run codex:check-protocol-sync
          else
            git fetch --no-tags --depth=1 origin "$BASE" || true
            npm run codex:check-protocol-sync -- --if-changed --base "$BASE"
          fi

      - name: Agent Host + product-config unit tests
        timeout-minutes: 20
        # D15 (#17): also run the fork's product-configuration pin tests
        # (extensionGallery Open VSX ruling + G9 presence gate,
        # agentsWindowStartup empty sessions allow-list) — pr.yml runs the full
        # suite on Microsoft's 1ES pool and never schedules on this fork, so
        # baseline is the only gate that can hold these pins. `--run` with the
        # source path (not --runGlob): the runner resolves the file directly
        # and fails loudly when it is missing, while an unmatched glob passes
        # silently with 0 tests.
        run: |
          npm run test-node -- --runGlob "vs/platform/agentHost/test/node/**/*.test.js"
          npm run test-node -- --run src/vs/code/test/node/extensionGallery.test.ts
          npm run test-node -- --run src/vs/code/test/node/agentsWindowStartup.test.ts

  agent-host-e2e:
    name: Agent Host E2E (deterministic replay)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Mirrors the Electron integration-test environment of pr-linux-test.yml:
      # the agent host E2E runner launches the real Electron binary.
      - name: Install Electron test dependencies and start Xvfb
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libxkbfile-dev \
            libkrb5-dev \
            libgbm1 \
            socat
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-codex-desktop
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Transpile suffices for the replay runner (it executes out/); a full
      # `npm run compile` would need Electron typings that the shared
      # node_modules cache (populated with ELECTRON_SKIP_BINARY_DOWNLOAD=1)
      # does not contain.
      - name: Transpile
        run: npm run gulp transpile-client-esbuild transpile-extensions

      # Deterministic replay only: no token, no network. An unrecorded model
      # request or an unconsumed recorded response fails this gate.
      - name: Agent Host E2E (replay)
        timeout-minutes: 30
        run: npm run test-agent-host-e2e
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'
